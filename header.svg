<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Abbishekk DGS — Engineer, Researcher, Builder, Pilot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080f"/>
      <stop offset="0.55" stop-color="#0d0b1e"/>
      <stop offset="1" stop-color="#170a26"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#ff00e4"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f5ff" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1000" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="14" fill="url(#grid)"/>

  <!-- scanning sweep -->
  <rect x="-120" y="0" width="120" height="320" fill="url(#scan)">
    <animate attributeName="x" from="-120" to="1000" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g fill="none" stroke="#00f5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M24 56V24H56"/>
    <path d="M944 24H976V56"/>
    <path d="M24 264V296H56"/>
    <path d="M976 264V296H944"/>
  </g>

  <!-- top HUD row -->
  <g font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="2">
    <circle cx="48" cy="40" r="5" fill="#ff3b3b">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="45" fill="#c9d1d9">REC  FPV // LIVE</text>
    <text x="952" y="45" fill="#c9d1d9" text-anchor="end">CHENNAI, IN  13.08°N 80.27°E</text>
  </g>

  <!-- left ring -->
  <g transform="translate(92 160)">
    <circle r="44" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
    <path d="M-60 0H-34M34 0H60M0 -60V-34M0 34V60" stroke="#00f5ff" stroke-width="1.5" opacity="0.8"/>
    <circle r="3" fill="#39ff14"/>
  </g>

  <!-- right ring -->
  <g transform="translate(908 160)">
    <circle r="44" fill="none" stroke="#ff00e4" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="none" stroke="#ff00e4" stroke-width="1" opacity="0.5"/>
    <path d="M-60 0H-34M34 0H60M0 -60V-34M0 34V60" stroke="#ff00e4" stroke-width="1.5" opacity="0.8"/>
    <circle r="3" fill="#39ff14"/>
  </g>

  <!-- name -->
  <text x="500" y="165" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="9" fill="url(#name)">ABBISHEKK DGS</text>
  <text x="500" y="208" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="17" letter-spacing="7" fill="#c9d1d9">ENGINEER · RESEARCHER · BUILDER · PILOT</text>

  <!-- animated rule -->
  <line x1="260" y1="232" x2="740" y2="232" stroke="url(#name)" stroke-width="2" stroke-dasharray="480" stroke-dashoffset="480" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="480;0;0;480" keyTimes="0;0.4;0.8;1" dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- bottom tags -->
  <g font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="1.5" text-anchor="middle">
    <rect x="150" y="262" width="220" height="30" rx="15" fill="none" stroke="#00f5ff" stroke-opacity="0.7"/>
    <text x="260" y="282" fill="#00f5ff">DGCA · REMOTE PILOT</text>
    <rect x="390" y="262" width="220" height="30" rx="15" fill="none" stroke="#ff00e4" stroke-opacity="0.7"/>
    <text x="500" y="282" fill="#ff00e4">YOLOv11 · EDGE AI</text>
    <rect x="630" y="262" width="220" height="30" rx="15" fill="none" stroke="#39ff14" stroke-opacity="0.7"/>
    <text x="740" y="282" fill="#39ff14">IEEE ICADCS 2026</text>
  </g>
</svg>
