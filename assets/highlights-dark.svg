<svg xmlns="http://www.w3.org/2000/svg" width="880" height="242" viewBox="0 0 880 242" role="img" aria-label="Key figures: 7+ years of hardware; 20+ drone projects; 2+ years of software; DGCA certified remote pilot. Engineer, researcher, builder and pilot. I design and fly UAVs, run computer vision on board, and build the embedded and web systems around them."><title>Key figures: 7+ years of hardware; 20+ drone projects; 2+ years of software; DGCA certified remote pilot. Engineer, researcher, builder and pilot. I design and fly UAVs, run computer vision on board, and build the embedded and web systems around them.</title><style>@font-face{font-family:'HG400';src:url(data:font/woff2;base64,) format('woff2')}.HG400{font-family:'HG400',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'NR400';src:url(data:font/woff2;base64,) format('woff2')}.NR400{font-family:'NR400',Georgia,'Times New Roman',serif}@font-face{font-family:'NR500';src:url(data:font/woff2;base64,) format('woff2')}.NR500{font-family:'NR500',Georgia,'Times New Roman',serif}</style><rect x="0.5" y="6.5" width="879.0" height="127.0" rx="12" fill="#151b23" stroke="#3d444d"/><text x="110.0" y="74.0" class="NR500" font-size="42" fill="#7fe3dd" text-anchor="middle">7+</text><text x="110.0" y="102.0" class="HG400" font-size="14" fill="#9198a1" text-anchor="middle">years of hardware</text><line x1="220.0" y1="36.0" x2="220.0" y2="104.0" stroke="#3d444d" stroke-width="1"/><text x="330.0" y="74.0" class="NR500" font-size="42" fill="#7fe3dd" text-anchor="middle">20+</text><text x="330.0" y="102.0" class="HG400" font-size="14" fill="#9198a1" text-anchor="middle">drone projects</text><line x1="440.0" y1="36.0" x2="440.0" y2="104.0" stroke="#3d444d" stroke-width="1"/><text x="550.0" y="74.0" class="NR500" font-size="42" fill="#7fe3dd" text-anchor="middle">2+</text><text x="550.0" y="102.0" class="HG400" font-size="14" fill="#9198a1" text-anchor="middle">years of software</text><line x1="660.0" y1="36.0" x2="660.0" y2="104.0" stroke="#3d444d" stroke-width="1"/><text x="770.0" y="74.0" class="NR500" font-size="42" fill="#7fe3dd" text-anchor="middle">DGCA</text><text x="770.0" y="102.0" class="HG400" font-size="14" fill="#9198a1" text-anchor="middle">certified remote pilot</text><text x="440.0" y="178.0" class="NR400" font-size="20" fill="#f0f6fc" text-anchor="middle">Engineer, researcher, builder and pilot. I design and fly UAVs, run computer vision on</text><text x="440.0" y="208.0" class="NR400" font-size="20" fill="#f0f6fc" text-anchor="middle">board, and build the embedded and web systems around them.</text></svg>
