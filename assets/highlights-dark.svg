<svg xmlns="http://www.w3.org/2000/svg" width="880" height="233" viewBox="0 0 880 233" role="img" aria-label="Key figures: 7+ years of hardware; 20+ drone projects; 2+ years of software; DGCA certified remote pilot. Engineer, researcher, builder and pilot. I design and fly UAVs, run computer vision on board, and build the embedded and web systems around them."><title>Key figures: 7+ years of hardware; 20+ drone projects; 2+ years of software; DGCA certified remote pilot. Engineer, researcher, builder and pilot. I design and fly UAVs, run computer vision on board, and build the embedded and web systems around them.</title><style>@font-face{font-family:'B6700';src:url(data:font/woff2;base64,) format('woff2')}.B6700{font-family:'B6700','Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'HG400';src:url(data:font/woff2;base64,) format('woff2')}.HG400{font-family:'HG400',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}</style><text x="110.0" y="62.0" class="B6700" font-size="38" fill="#f0f6fc" text-anchor="middle">7+</text><line x1="101.0" y1="76.0" x2="119.0" y2="76.0" stroke="#7fe3dd" stroke-width="2"/><text x="110.0" y="100.0" class="HG400" font-size="14" fill="#9198a1" text-anchor="middle">years of hardware</text><line x1="220.0" y1="22.0" x2="220.0" y2="98.0" stroke="#30363d" stroke-width="1"/><text x="330.0" y="62.0" class="B6700" font-size="38" fill="#f0f6fc" text-anchor="middle">20+</text><line x1="321.0" y1="76.0" x2="339.0" y2="76.0" stroke="#7fe3dd" stroke-width="2"/><text x="330.0" y="100.0" class="HG400" font-size="14" fill="#9198a1" text-anchor="middle">drone projects</text><line x1="440.0" y1="22.0" x2="440.0" y2="98.0" stroke="#30363d" stroke-width="1"/><text x="550.0" y="62.0" class="B6700" font-size="38" fill="#f0f6fc" text-anchor="middle">2+</text><line x1="541.0" y1="76.0" x2="559.0" y2="76.0" stroke="#7fe3dd" stroke-width="2"/><text x="550.0" y="100.0" class="HG400" font-size="14" fill="#9198a1" text-anchor="middle">years of software</text><line x1="660.0" y1="22.0" x2="660.0" y2="98.0" stroke="#30363d" stroke-width="1"/><text x="770.0" y="62.0" class="B6700" font-size="38" fill="#f0f6fc" text-anchor="middle">DGCA</text><line x1="761.0" y1="76.0" x2="779.0" y2="76.0" stroke="#7fe3dd" stroke-width="2"/><text x="770.0" y="100.0" class="HG400" font-size="14" fill="#9198a1" text-anchor="middle">certified remote pilot</text><text x="440.0" y="160.0" class="HG400" font-size="19" fill="#f0f6fc" text-anchor="middle">Engineer, researcher, builder and pilot. I design and fly UAVs, run computer vision</text><text x="440.0" y="189.0" class="HG400" font-size="19" fill="#f0f6fc" text-anchor="middle">on board, and build the embedded and web systems around them.</text></svg>
