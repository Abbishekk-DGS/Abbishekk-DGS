ry Pi 5</text><text x="198.0" y="81.0" class="HG400" font-size="13" fill="#59636e" text-anchor="start">On-board compute</text><path d="M341.0 71.0 H356.0" stroke="#8c959f" stroke-width="1.5" fill="none"/><path d="M351.0 66.5 L357.0 71.0 L351.0 75.5" stroke="#8c959f" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="364.5" y="0.5" width="151.0" height="141" rx="10" fill="#e3f4f2" stroke="#a8dcd6"/><text x="380.0" y="30.0" class="HG600" font-size="12" fill="#0c7a72" text-anchor="start" letter-spacing="0.5">03</text><text x="380.0" y="56.0" class="HG600" font-size="16" fill="#1f2328" text-anchor="start">YOLOv11</text><text x="380.0" y="81.0" class="HG400" font-size="13" fill="#59636e" text-anchor="start">Custom-trained</text><text x="380.0" y="99.0" class="HG400" font-size="13" fill="#59636e" text-anchor="start">detection</text><path d="M523.0 71.0 H538.0" stroke="#8c959f" stroke-width="1.5" fill="none"/><path d="M533.0 66.5 L539.0 71.0 L533.0 75.5" stroke="#8c959f" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="546.5" y="0.5" width="151.0" height="141" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="562.0" y="30.0" class="HG600" font-size="12" fill="#0c7a72" text-anchor="start" letter-spacing="0.5">04</text><text x="562.0" y="56.0" class="HG600" font-size="16" fill="#1f2328" text-anchor="start">Flask + SQLite3</text><text x="562.0" y="81.0" class="HG400" font-size="13" fill="#59636e" text-anchor="start">Backend and</text><text x="562.0" y="99.0" class="HG400" font-size="13" fill="#59636e" text-anchor="start">storage</text><path d="M705.0 71.0 H720.0" stroke="#8c959f" stroke-width="1.5" fill="none"/><path d="M715.0 66.5 L721.0 71.0 L715.0 75.5" stroke="#8c959f" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="728.5" y="0.5" width="151.0" height="141" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="744.0" y="30.0" class="HG600" font-size="12" fill="#