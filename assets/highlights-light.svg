hor="middle">years of software</text><line x1="528.0" y1="36.0" x2="528.0" y2="104.0" stroke="#d1d9e0" stroke-width="1"/><text x="616.0" y="74.0" class="NR500" font-size="42" fill="#0c7a72" text-anchor="middle">IEEE</text><text x="616.0" y="102.0" class="HG400" font-size="14" fill="#59636e" text-anchor="middle">ICADCS 2026, published</text><line x1="704.0" y1="36.0" x2="704.0" y2="104.0" stroke="#d1d9e0" stroke-width="1"/><text x="792.0" y="74.0" class="NR500" font-size="42" fill="#0c7a72" text-anchor="middle">DGCA</text><text x="792.0" y="102.0" class="HG400" font-size="14" fill="#59636e" text-anchor="middle">certified remote pilot</text><text x="440.0" y="178.0" class="NR400" font-size="20" fill="#1f2328" text-anchor="middle">Engineer, researcher, builder and pilot. I design and fly UAVs, run computer vision on</text><text x="440.0" y="208.0" class="NR400" font-size="20" fill="#1f2328" text-anchor="middle">board, and build the embedded and web systems around them.</text></svg>
